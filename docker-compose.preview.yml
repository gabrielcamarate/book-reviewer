services:
  review-web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8765:8765"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command:
      - ./scripts/workspace-python.sh
      - -m
      - review_web.server
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --preview-token
      - ${PREVIEW_TOKEN}
