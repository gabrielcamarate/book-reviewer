[project]
name = "review-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "docx-adapter",
  "editorial-core",
  "editorial-prompts",
  "editorial-schemas",
]

[tool.uv.sources]
docx-adapter = { workspace = true }
editorial-core = { workspace = true }
editorial-prompts = { workspace = true }
editorial-schemas = { workspace = true }

[project.scripts]
review-cli = "review_cli.main:main"
review-approve = "review_cli.apply_review:main"
review-copyedit-batch = "review_cli.run_copyedit_batch:main"
review-chunks = "review_cli.generate_chunks:main"
review-consistency = "review_cli.run_consistency_report:main"
review-export = "review_cli.export_docx:main"
review-glossary = "review_cli.generate_glossary:main"
review-copyedit = "review_cli.run_copyedit:main"
review-style-guide = "review_cli.generate_style_guide:main"
review-translate-es = "review_cli.run_translation_es:main"
