<span style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 500; letter-spacing: -0.01em">Revisor</span>

<a href="mais-opcoes.html" style="min-height: 52px; padding: 0 18px; display: inline-flex; align-items: center; color: #F6F1E9; font-weight: 600; text-decoration: none; border-radius: 12px">Mais opções</a>

<main style="width: 100%; max-width: 1160px; box-sizing: border-box; margin: 0 auto; padding: 28px 40px 64px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex">
<a href="aprovar-a-mao-conferir.html" style="min-height: 48px; display: inline-flex; align-items: center; gap: 10px; font-weight: 600; text-underline-offset: 5px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
Voltar sem salvar
</a>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<p style="margin: 0; font-size: 16px; color: #CFCAC0">Trecho 4 de 86 · Capítulo 3 — A maré baixa</p>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 48px; font-weight: 500; line-height: 1.12; letter-spacing: -0.015em; text-wrap: balance">Ajustar o texto</h1>
</div>
<p style="margin: 0; max-width: 760px; color: #CFCAC0">Mude o que quiser no texto revisado. Seu original continua guardado.</p>
</div>

<section aria-label="Texto revisado do trecho" style="width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aj-p1" style="font-size: 16px; font-weight: 600">Parágrafo 1</label>
<textarea id="aj-p1" rows="3" style="width: 100%; box-sizing: border-box; padding: 16px; background: #141A23; color: #F6F1E9; border: 1.5px solid #6B7380; border-radius: 12px; font: inherit; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; resize: vertical">Havia muitas conchas na areia quando Helena chegou à praia. O vento trazia um cheiro de sal e de coisa antiga, e ela pensou que, talvez, a casa ainda se lembrasse dela.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aj-p2" style="font-size: 16px; font-weight: 600">Parágrafo 2</label>
<textarea id="aj-p2" rows="3" style="width: 100%; box-sizing: border-box; padding: 16px; background: #141A23; color: #F6F1E9; border: 1.5px solid #6B7380; border-radius: 12px; font: inherit; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; resize: vertical">Ela subiu os degraus devagar, contando cada um como fazia em criança. A porta estava entreaberta, e a maçaneta, fria como sempre, cedeu sem fazer barulho nenhum.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aj-p3" style="font-size: 16px; font-weight: 600">Parágrafo 3</label>
<textarea id="aj-p3" rows="3" style="width: 100%; box-sizing: border-box; padding: 16px; background: #141A23; color: #F6F1E9; border: 1.5px solid #6B7380; border-radius: 12px; font: inherit; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; resize: vertical">— Tem alguém aí? — perguntou, e a própria voz lhe pareceu de outra pessoa.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aj-p4" style="font-size: 16px; font-weight: 600">Parágrafo 4</label>
<textarea id="aj-p4" rows="4" style="width: 100%; box-sizing: border-box; padding: 16px; background: #141A23; color: #F6F1E9; border: 1.5px solid #6B7380; border-radius: 12px; font: inherit; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; resize: vertical">Na cozinha, as xícaras continuavam penduradas nos mesmos ganchos. Fazia vinte anos que ninguém as tirava dali, mas o pó parecia recente, como se alguém tivesse passado a mão há poucos dias.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aj-p5" style="font-size: 16px; font-weight: 600">Parágrafo 5</label>
<textarea id="aj-p5" rows="4" style="width: 100%; box-sizing: border-box; padding: 16px; background: #141A23; color: #F6F1E9; border: 1.5px solid #6B7380; border-radius: 12px; font: inherit; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; resize: vertical">Helena abriu a janela e deixou que a claridade entrasse. Lá fora, a maré baixa descobria as pedras onde ela e o irmão brincavam, e por um instante ela teve a impressão de ouvir os dois rindo.</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aj-p6" style="font-size: 16px; font-weight: 600">Parágrafo 6</label>
<textarea id="aj-p6" rows="4" style="width: 100%; box-sizing: border-box; padding: 16px; background: #141A23; color: #F6F1E9; border: 1.5px solid #6B7380; border-radius: 12px; font: inherit; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; resize: vertical">Sentou-se na cadeira do pai, que rangeu do mesmo jeito. Em cima da mesa havia um envelope com o seu nome escrito à mão, e ela soube, antes de abri-lo, que não tinha voltado por acaso.</textarea>
</div>

</section>
