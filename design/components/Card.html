<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<div class="rv-stage" style="align-items: flex-start; gap: var(--space-6)">
<section class="rv-card" style="flex: 3 1 420px; min-width: 0">
<h2 class="title-card">Tudo pronto para começar</h2>
<p class="rv-muted">O livro foi importado. Agora o Revisor corrige o português, traduz para o espanhol e revisa a tradução, tudo em sequência.</p>
<button type="button" class="rv-btn rv-btn--primary rv-btn--lg rv-btn--block">Processar o livro completo</button>
</section>
<aside class="rv-card rv-card--outline" style="flex: 2 1 300px; min-width: 0">
<h2 class="title-section">Seus arquivos</h2>
<p class="rv-muted rv-small">Os dois arquivos Word aparecem aqui para baixar quando as quatro etapas terminarem.</p>
</aside>
</div>
</body>
</html>
