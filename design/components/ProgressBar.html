<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<title>ProgressBar</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<div class="rv-stage rv-stage--stack" style="gap: var(--space-6)">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: var(--space-3)"><strong>Traduzir para o espanhol</strong><strong class="rv-num" style="color: var(--primary)">71%</strong></div>
<div class="rv-progress"><div class="rv-progress__bar" style="width: 71%"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: var(--space-3)"><span>Revisar o espanhol</span><span class="rv-muted rv-num">50%</span></div>
<div class="rv-progress rv-progress--neutral"><div class="rv-progress__bar" style="width: 50%"></div></div>
</div>
</div>
</body>
</html>
