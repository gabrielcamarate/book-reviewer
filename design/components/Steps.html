<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Steps</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<div class="rv-stage rv-stage--stack">
<ol class="rv-steps">
<li class="rv-step rv-step--done">
<span class="rv-step__mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
<div class="rv-step__body"><span class="rv-step__title">Revisar o português</span></div>
<span class="rv-step__status">Concluído</span>
</li>
<li class="rv-step rv-step--done">
<span class="rv-step__mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
<div class="rv-step__body"><span class="rv-step__title">Conferir e aplicar as correções</span></div>
<span class="rv-step__status">Concluído</span>
</li>
<li class="rv-step rv-step--current">
<span class="rv-step__mark" aria-hidden="true">3</span>
<div class="rv-step__body"><span class="rv-step__title">Traduzir para o espanhol</span><div class="rv-progress"><div class="rv-progress__bar" style="width: 71%"></div></div></div>
<span class="rv-step__status">71%</span>
</li>
<li class="rv-step">
<span class="rv-step__mark" aria-hidden="true">4</span>
<div class="rv-step__body"><span class="rv-step__title">Revisar o espanhol</span><div class="rv-progress rv-progress--neutral"><div class="rv-progress__bar" style="width: 50%"></div></div></div>
<span class="rv-step__status">50%</span>
</li>
</ol>
</div>
</body>
</html>
