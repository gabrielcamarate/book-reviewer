<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Button</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">

<body>
<div class="rv-stage rv-stage--stack">
<div class="rv-actions">
<button type="button" class="rv-btn rv-btn--primary rv-btn--lg">Processar o livro completo</button>

<button type="button" class="rv-btn">Cancelar</button>
</div>
<div class="rv-actions">

<button type="button" class="rv-btn rv-btn--lg" disabled>Processar o livro completo</button>

</div>
