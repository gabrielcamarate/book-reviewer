<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Revisor" />
    <meta name="apple-mobile-web-app-title" content="Revisor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="../design/assets/brand/revisor-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../design/assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="../design/assets/brand/apple-touch-icon.png" />
    <script>
      // Before the first paint: the saved choice, else the system theme. Kept in sync with src/lib/theme.ts.
      (function () {
        var theme = null
        try { theme = localStorage.getItem("revisor-theme") } catch (error) { theme = null }
        if (theme !== "dark" && theme !== "light") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        document.documentElement.dataset.theme = theme
        var size = null
        try { size = localStorage.getItem("revisor-text-size") } catch (error) { size = null }
        document.documentElement.dataset.textSize = size === "large" || size === "larger" ? size : "normal"
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Revisor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
